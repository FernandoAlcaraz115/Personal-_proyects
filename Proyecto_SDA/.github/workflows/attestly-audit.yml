name: Attestly AI Hallucination & Security Audit

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  audit:
    name: Audit AI Code & Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Attestly Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Attestly Code & Slopsquatting Scan
        run: |
          python -m app.cli scan . --fail-on high --format table

      - name: Generate Machine-Readable Audit Report (JSON)
        if: always()
        run: |
          python -m app.cli scan . --format json > attestly-audit-report.json

      - name: Upload Audit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attestly-audit-report
          path: attestly-audit-report.json
